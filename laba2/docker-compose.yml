services:

  mosquitto:
    image: eclipse-mosquitto:2
    container_name: mosquitto2
    restart: unless-stopped

    ports:
      - "1883:1883"

    volumes:
      - ./mosquitto/config:/mosquitto/config
      - ./mosquitto/data:/mosquitto/data
      - ./mosquitto/log:/mosquitto/log

    networks:
      - iot_venus_net

  nodered:
    image: nodered/node-red:latest
    container_name: nodered2
    restart: unless-stopped

    ports:
      - "1880:1880"

    volumes:
      - ./nodered/data:/data

    networks:
      - iot_venus_net

    depends_on:
      - mosquitto
      - influxdb

  influxdb:
    image: influxdb:2
    container_name: influxdb
    restart: unless-stopped

    ports:
      - "8086:8086"

    volumes:
      - influxdb_data:/var/lib/influxdb2

    networks:
      - iot_venus_net

networks:
  iot_venus_net:
    name: iot_venus_net
    driver: bridge

volumes:
  influxdb_data: